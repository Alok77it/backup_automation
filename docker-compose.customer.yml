services:
  postgres:
    image: postgres:16-alpine
    container_name: bi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backupintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backupintel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-backup_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backupintel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bi-network

  redis:
    image: redis:7-alpine
    container_name: bi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bi-network

  api:
    image: ${IMAGE_NAMESPACE:-aloktr2002}/backup-automation-backend:${IMAGE_TAG:-latest}
    container_name: bi-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-backupintel}:${POSTGRES_PASSWORD:-backupintel_secret}@postgres:5432/${POSTGRES_DB:-backup_intelligence}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ${BACKUP_STORAGE_PATH:-/data/backups}:/data/backups
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    expose:
      - "8000"
    networks:
      - bi-network

  worker:
    image: ${IMAGE_NAMESPACE:-aloktr2002}/backup-automation-backend:${IMAGE_TAG:-latest}
    container_name: bi-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_devops worker --loglevel=info --concurrency=4 -Q celery,devops_low,devops_medium,devops_high
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-backupintel}:${POSTGRES_PASSWORD:-backupintel_secret}@postgres:5432/${POSTGRES_DB:-backup_intelligence}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ${BACKUP_STORAGE_PATH:-/data/backups}:/data/backups
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bi-network

  beat:
    image: ${IMAGE_NAMESPACE:-aloktr2002}/backup-automation-backend:${IMAGE_TAG:-latest}
    container_name: bi-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_devops beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-backupintel}:${POSTGRES_PASSWORD:-backupintel_secret}@postgres:5432/${POSTGRES_DB:-backup_intelligence}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - bi-network

  frontend:
    image: ${IMAGE_NAMESPACE:-aloktr2002}/backup-automation-frontend:${IMAGE_TAG:-latest}
    container_name: bi-frontend
    restart: unless-stopped
    environment:
      DISABLE_WELCOME: "true"
      NEXT_PUBLIC_DISABLE_WELCOME: "true"
      NEXT_PUBLIC_API_URL: /api
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    expose:
      - "3000"
    networks:
      - bi-network

  nginx:
    image: nginx:alpine
    container_name: bi-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - bi-network

  prometheus:
    image: ${IMAGE_NAMESPACE:-aloktr2002}/backup-automation-prometheus:${IMAGE_TAG:-latest}
    container_name: bi-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - bi-network

  migrate:
    image: ${IMAGE_NAMESPACE:-aloktr2002}/backup-automation-backend:${IMAGE_TAG:-latest}
    container_name: bi-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-backupintel}:${POSTGRES_PASSWORD:-backupintel_secret}@postgres:5432/${POSTGRES_DB:-backup_intelligence}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bi-network
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  bi-network:
    driver: bridge
